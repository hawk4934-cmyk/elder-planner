<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엘더플래너">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>엘더플래너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#1B2430; --sub:#5A6573; --mute:#6B7684; --line:#E1E5EA; --soft:#EEF0F2;
  --acc:#1F5E6B; --acc-d:#16444E; --acc-l:#E3ECEE;
  --warn:#B5651D; --warn-d:#8A4512; --warn-l:#FBEBDD;
  --ok:#2E8A51; --ok-d:#22663C; --ok-l:#E2F1E7;
  --late:#B3412E; --late-l:#F8E3DF; --purple:#5B4A86;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc)}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--acc)}
.h1{font-size:24px;font-weight:700;margin:0}
.h2{font-size:17px;font-weight:700;margin:18px 0 10px}
.sub{font-size:13px;color:var(--sub)}
.mute{color:var(--mute)}
.card{background:var(--card);border-radius:16px;padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border:none;border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none;text-decoration:none}
.icon-btn.ghost{background:transparent}
.btn{min-height:48px;border-radius:14px;border:1px solid #C3CAD2;background:#fff;font-weight:600;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--late);border-color:#E6B8B0}
.btn.block{width:100%}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn.dash{border-style:dashed;color:var(--sub);background:transparent;font-weight:500}
.btn:disabled{opacity:.5}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.st-none{background:var(--soft);color:var(--sub)} .st-set{background:var(--acc-l);color:var(--acc-d)}
.st-prep{background:var(--warn-l);color:var(--warn-d)} .st-done{background:var(--ok-l);color:var(--ok-d)}
.st-late{background:var(--late-l);color:var(--late)} .st-any{background:#ECE8F4;color:var(--purple)}
.bar{height:4px;border-radius:4px;background:#E6EAEE;overflow:hidden}
.bar>i{display:block;height:4px;border-radius:4px}
.dark{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dark .sub{color:#C9D3DD}
.dark a{color:#fff;text-decoration:none}
.dday{width:56px;flex:none;text-align:center;border-radius:12px;padding:6px 0;background:var(--warn)}
.dday.late{background:var(--late)} .dday.soft{background:#33404F}
.dday small{display:block;font-size:11px} .dday b{font-size:15px}
.num{width:36px;height:36px;flex:none;border-radius:10px;background:var(--acc-l);color:var(--acc);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:46px;color:var(--ink);font-size:15px;width:100%}
textarea{resize:vertical}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--soft);gap:10px}
.kv:last-child{border-bottom:none}
.kv input,.kv select{border:none;background:transparent;text-align:right;font-weight:600;min-height:44px;font-size:15px;max-width:64%;color:var(--ink)}
.kv select{text-align-last:right}
.line{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px solid var(--soft)}
.line:last-child{border-bottom:none}
.line input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);margin:0 4px;flex:none}
.line input.t{flex:1;min-width:0;border:none;background:transparent;min-height:44px;font-size:15px;padding:0 4px}
.line input.tm{width:70px;flex:none;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 8px;text-align:center}
.line.done input.t{color:#9AA3AE;text-decoration:line-through}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:#E3E7EB;border-radius:14px;padding:4px}
.seg button,.seg a{min-height:40px;border:none;border-radius:10px;background:transparent;color:var(--sub);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px}
.seg .on{background:#fff;color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--sub);cursor:pointer;font-size:13px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal{background:#fff;border-radius:18px;padding:10px 6px 8px}
.cal .dow,.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.cal .grid button{min-height:64px;border:none;background:transparent;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px 1px;cursor:pointer;border-radius:10px}
.cal .grid button.out{opacity:.35}
.cal .grid button.sel{outline:2px solid var(--acc);outline-offset:-2px}
.cal .d{font-size:13px;text-align:center}
.cal .today .d span{background:var(--ink);color:#fff;border-radius:99px;padding:0 6px}
.sun{color:var(--late)}
.tag{font-size:9px;line-height:1.35;padding:1px 3px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.years button{background:#fff;border:none;border-radius:14px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left;cursor:pointer}
.years button.now{outline:2px solid var(--acc);outline-offset:-2px}
.years .it{font-size:11px;line-height:1.3;border-radius:6px;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.evrow{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.evrow .bar6{width:6px;align-self:stretch;border-radius:3px;flex:none}
.done-t{color:#9AA3AE;text-decoration:line-through}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}
nav#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav#tabs a{position:relative;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mute);font-size:11px}
nav#tabs a.on{color:var(--acc);font-weight:600}
nav#tabs .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:99px;background:var(--late)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(27,36,48,.22);z-index:9}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 8px}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14px;line-height:1.6}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.progress{height:8px;border-radius:8px;background:#E6EAEE;overflow:hidden}
.progress>i{display:block;height:8px;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.migrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--soft)}
.migrow:last-child{border-bottom:none}
.migrow select{border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 8px;background:#fff;width:100%}
.migrow.c select{border-color:var(--acc);background:var(--acc-l)}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="tabs" aria-label="주 메뉴" hidden><div class="in">
  <a href="#home" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>달력</a>
  <a href="#today" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>오늘<span class="dot" id="todayDot" hidden></span></a>
  <a href="#cong" data-tab="cong"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10z"/><path d="M9 20v-6h6v6"/></svg>회중</a>
  <a href="#memo" data-tab="memo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>메모</a>
  <a href="#settings" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</a>

<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" aria-label="백업 파일 선택">

<script type="module">
/* =====================================================================
   엘더플래너 (개인 + 회중 통합 플래너)  v1.0
   저장 구조 (Firestore, 프로젝트 k-planner-ef6e3)
     users/{uid}                 프로필, 개인 구분(categories), 가져오기 기록
     users/{uid}/events/{id}     개인 일정
     users/{uid}/todos/{날짜}     날짜별 할 일
     users/{uid}/memos/{id}      중요 메모
     planners/{pid}              회중 플래너 (owner, members) — 지금은 pid = 내 uid
     planners/{pid}/items/{id}   회중 주요 일정 항목
     planners/{pid}/events/{id}  회중 일정
   기존 k-planner 데이터(planner/meta, planner/user_*)는 설정 › 기존 데이터 가져오기에서 읽기만 함
   ===================================================================== */
const APP_NAME = '엘더플래너';
const APP_VERSION = '1.0';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBaC3DnqbtLg3paTndvFn6APGkeZhybG8A",
  authDomain: "k-planner-ef6e3.firebaseapp.com",
  projectId: "k-planner-ef6e3",
  storageBucket: "k-planner-ef6e3.firebasestorage.app",
  messagingSenderId: "1028952362388",
  appId: "1:1028952362388:web:376340980b3c22f7dd5381"
};

/* ---------- 색상 ---------- */
const CAT_COLORS = ['#3B6D11', '#185FA5', '#993C1D', '#534AB7', '#854F0B', '#A32D2D', '#0F6E56'];
const CAT_BG = ['#EAF3DE', '#E6F1FB', '#FAECE7', '#EDEAFB', '#FBF0E0', '#FBE7E7', '#E3F5F0'];
const CONG = { bg: '#1F5E6B', fg: '#FFFFFF', bar: '#1F5E6B' };
const DEFAULT_CATS = ['집회', '행사', '회의', '교육', '봉사', '기타'];

/* ---------- 회중 주요 일정 항목 기본값 ----------
   [id, 그룹, 이름, 주기표시, 봉사연도 횟수(0=수시), 칸 나누기(half|season|null), 준비사항, 알림(일 전)] */
const SEED_ITEMS = [
  ['lecture', '특별강연', '특별강연', '가을 · 봄', 2, 'season', ['연사'], 90],
  ['memorial', '주의만찬 기념식', '주의만찬 기념식', '봄', 1, null, ['장소', '연사 및 진행'], 90],
  ['visit', '순회방문', '순회방문', '상반기 · 하반기', 2, 'half', ['서류', '일정계획표', '회중광고'], 30],
  ['ca', '대회', '순회대회', '연 2회', 2, null, ['서류', '일정계획표', '회중광고'], 60],
  ['cap', '대회', '순회대회 P모임', '연 1회', 1, null, [], null],
  ['rc', '대회', '지역대회', '', 1, null, ['서류', '일정계획표', '회중광고'], null],
  ['ic', '대회', '국제대회', '해당 시', 0, null, ['신청접수 (서기)'], null],
  ['sp', '대회', '특별모임', '해당 시', 0, null, ['회중광고'], null],
  ['coact', '특별활동', '특별활동 (봉사감독자)', '', 1, null, ['기간 및 내용'], null],
  ['em', '장로모임', '정기장로모임', '연 4회', 4, null, ['회의록 (의제)'], null],
  ['em2', '장로모임', '간이 장로모임', '2회', 2, null, ['회의록 (의제)'], null],
  ['pm', '정기파이오니아 모임', '정기파이오니아 모임', '연말연초', 1, null, ['회중광고', '연사'], null],
  ['es', '신권학교', '장로학교', '', 1, null, ['일정확인'], null],
  ['ks', '신권학교', '왕국전도학교', '', 1, null, ['일정확인'], null],
  ['ps', '신권학교', '파이오니아학교', '', 1, null, ['일정확인 (해당P)', '식사'], null],
  ['wed', '회중경조사', '결혼', '수시', 0, null, ['광고'], null],
  ['fun', '회중경조사', '장례', '수시', 0, null, ['회중광고', '장례식 준비'], null],
  ['picnic', '기타 행사', '야유회', '', 1, null, ['진행', '장소 섭외'], null],
  ['unc', '미분류', '미분류 회중 일정', '', 0, null, [], null]
];
const seedItemObjs = () => SEED_ITEMS.map(([id, group, name, freq, times, slotType, prep, leadDays], i) => ({ id, group, name, freq, times, slotType, prep, leadDays, order: i + 1 }));
/* 엘더플래너 v0.1 백업의 항목 id → 새 항목 id */
const ELDER_MAP = { i01: 'lecture', i02: 'memorial', i03: 'visit', i04: 'ca', i05: 'cap', i06: 'rc', i07: 'ic', i08: 'sp', i09: 'coact', i10: 'em', i11: 'em2', i12: 'pm', i13: 'es', i14: 'ks', i15: 'ps', i16: 'wed', i17: 'fun', i18: 'picnic' };
/* 기존 일정 자동 분류: 제목(띄어쓰기 무시)에 들어 있는 낱말 → 회중 항목 */
const RULES = [
  [/순회방문|순회감독자/, 'visit'], [/특별강연/, 'lecture'], [/기념식|주의만찬/, 'memorial'],
  [/순회대회.*P|P모임/, 'cap'], [/순회대회/, 'ca'], [/지역대회/, 'rc'], [/국제대회/, 'ic'], [/특별모임/, 'sp'],
  [/파이오니아학교/, 'ps'], [/왕국전도학교/, 'ks'], [/장로학교/, 'es'],
  [/간이.*장로모임/, 'em2'], [/장로모임/, 'em'], [/파이오니아모임/, 'pm'],
  [/봉사감독자|특별활동/, 'coact'], [/결혼/, 'wed'], [/장례/, 'fun'], [/야유회/, 'picnic']
];
function classify(ev) {
  const t = (ev.title || '').replace(/\s+/g, '');
  for (const [re, id] of RULES) if (re.test(t)) return itemOf(id) ? id : 'unc';
  if (['집회', '회의', '교육'].includes(ev.cat)) return 'unc';
  return 'p';
}
const LEADS = [[null, '알림 없음'], [7, '1주 전'], [14, '2주 전'], [30, '1달 전'], [60, '2달 전'], [90, '3달 전']];
const leadLabel = v => (LEADS.find(l => l[0] === (v ?? null)) || [null, v + '일 전'])[1];
const leadOptions = sel => LEADS.map(([v, l]) => `<option value="${v ?? ''}" ${v === (sel ?? null) ? 'selected' : ''}>${l}</option>`).join('');

/* ---------- 날짜 · 봉사연도 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const md = s => { if (!s) return ''; const d = parse(s); return `${d.getMonth() + 1}.${pad(d.getDate())} (${DOW[d.getDay()]})`; };
const mdShort = s => { const d = parse(s); return `${d.getMonth() + 1}.${pad(d.getDate())}`; };
const span = e => e.end && e.end > e.start ? `${md(e.start)} – ${md(e.end)}` : md(e.start);
const endOf = e => e.end && e.end > e.start ? e.end : e.start;
const onDate = (e, d) => e.start <= d && d <= endOf(e);
const syOf = s => { const y = +s.slice(0, 4), m = +s.slice(5, 7); return m >= 9 ? y + 1 : y; };   // 봉사연도: 끝나는 해 이름
const halfOf = s => { const m = +s.slice(5, 7); return (m >= 9 || m <= 3) ? '상반기' : '하반기'; };  // 상반기 9~3월, 하반기 4~8월
const seasonOf = s => { const m = +s.slice(5, 7); return (m >= 9 || m <= 2) ? '가을' : '봄'; };    // 가을 9~2월, 봄 3~8월
const SLOTS = { half: ['상반기', '하반기'], season: ['가을', '봄'] };

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastT;

const S = {

  cal: { mode: 'month', cursor: today(), sel: today(), filter: 'all' },
  sy: syOf(today()), recQ: '', todoDate: today(), openNote: null, mig: null
};
const allEv = () => S.pev.concat(S.cev);
const cats = () => (S.profile.categories && S.profile.categories.length) ? S.profile.categories : DEFAULT_CATS;
function catStyle(cat) { const i = cats().indexOf(cat); return i < 0 ? { bg: '#EEF0F2', fg: '#5A6573', bar: '#9AA3AE' } : { bg: CAT_BG[i % 7], fg: CAT_COLORS[i % 7], bar: CAT_COLORS[i % 7] }; }
const chipStyle = e => e.area === 'c' ? CONG : catStyle(e.cat);
const itemOf = id => S.items.find(i => i.id === id);
const sortedItems = () => [...S.items].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const congOf = (itemId, sy) => S.cev.filter(e => e.itemId === itemId && (!sy || syOf(e.start) === sy)).sort(byStart);
function slotOf(e) { const it = itemOf(e.itemId); if (!it || !it.slotType) return null; if (it.slotType === 'season' && e.slot) return e.slot; return slotByDate(it.slotType, e.start); }
const leadOf = e => e.leadDays !== undefined ? e.leadDays : (itemOf(e.itemId)?.leadDays ?? null);
const alertDate = e => { if (e.area !== 'c') return null; const l = leadOf(e); return l ? addDays(e.start, -l) : null; };
const doneCount = e => (e.checklist || []).filter(t => t.done).length;

function groups() {
  const m = new Map();
  sortedItems().forEach(i => {
    if (i.id === 'unc' && !S.cev.some(e => e.itemId === 'unc')) return;
    if (!m.has(i.group)) m.set(i.group, []);

}
function evState(e) {
  if (e.done) return 'done';

  if (endOf(e) < t) return 'late';
  const a = alertDate(e);
  if ((a && a <= t) || diffDays(e.start, t) <= 14) return 'prep';

}
const ST = {
  none: ['미설정', 'st-none', '#C3CAD2'], set: ['설정됨', 'st-set', '#1F5E6B'], prep: ['준비중', 'st-prep', '#B5651D'],
  done: ['완료', 'st-done', '#2E8A51'], late: ['정리 필요', 'st-late', '#B3412E'], any: ['수시', 'st-any', '#5B4A86']
};
const chip = k => `<span class="chip ${ST[k][1]}">${ST[k][0]}</span>`;

/* ---------- Firebase ---------- */
let A, Au, F, auth, db;
const unsubs = [];
async function loadSDK() {
  if (window.__FB_MOCK__) return window.__FB_MOCK__;   // 점검용 모의 객체 (실사용 시 없음)
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [a, au, f] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  return { A: a, Au: au, F: f };
}
async function boot() {
  try {
    ({ A, Au, F } = await loadSDK());
    const app = A.initializeApp(FIREBASE_CONFIG);
    auth = Au.getAuth(app);
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch (e) { db = F.getFirestore(app); }
    Au.getRedirectResult(auth).catch(e => toast('로그인 실패: ' + (e.code || e.message)));
    Au.onAuthStateChanged(auth, u => onUser(u).catch(err => { S.phase = 'error'; S.err = err.code || err.message; render(); }));
  } catch (err) {
    S.phase = 'error'; S.err = 'Firebase를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요. (' + err.message + ')'; render();
  }
}
const uref = (...p) => F.doc(db, 'users', S.uid, ...p);
const ucol = (...p) => F.collection(db, 'users', S.uid, ...p);
const pref = (...p) => F.doc(db, 'planners', S.pid, ...p);
const pcol = (...p) => F.collection(db, 'planners', S.pid, ...p);
const evRef = e => e.area === 'c' ? pref('events', e.id) : uref('events', e.id);

async function onUser(u) {
  unsubs.splice(0).forEach(f => f());
  S.user = u;
  if (!u) {
    Object.assign(S, { phase: 'login', uid: null, pid: null, profile: {}, pev: [], cev: [], items: [], todos: {}, memos: [], mig: null });
    render(); return;
  }
  S.phase = 'loading'; render();
  S.uid = u.uid; S.pid = u.uid;
  F.setDoc(uref(), { name: u.displayName || '', email: u.email || '', lastLogin: Date.now() }, { merge: true }).catch(() => {});
  try {
    const ps = await F.getDoc(pref());
    if (!ps.exists()) await F.setDoc(pref(), { owner: u.uid, members: [u.uid], name: '회중 일정', created: Date.now() });
  } catch (e) { if (e.code === 'permission-denied') throw new Error('보안 규칙이 막고 있습니다. firestore.rules를 적용했는지 확인해 주세요.'); }
  const first = new Set();
  const mark = k => {
    if (!first.has(k)) { first.add(k); if (first.size === 6) { S.phase = 'ready'; afterReady(); return; } }
    scheduleRender(true);
  };
  const onErr = k => err => { toast(`불러오기 오류 (${k}): ${err.code || err.message}`); mark(k); };
  unsubs.push(F.onSnapshot(uref(), s => { S.profile = s.exists() ? s.data() : {}; mark('profile'); }, onErr('profile')));
  unsubs.push(F.onSnapshot(ucol('events'), qs => { S.pev = qs.docs.map(d => ({ ...d.data(), area: 'p' })); mark('pev'); }, onErr('pev')));
  unsubs.push(F.onSnapshot(ucol('todos'), qs => { const m = {}; qs.docs.forEach(d => { m[d.id] = d.data().items || []; }); S.todos = m; mark('todos'); }, onErr('todos')));
  unsubs.push(F.onSnapshot(ucol('memos'), qs => { S.memos = qs.docs.map(d => d.data()); mark('memos'); }, onErr('memos')));
  let checked = false;
  unsubs.push(F.onSnapshot(pcol('items'), async qs => {
    if (!checked && !qs.metadata.fromCache) {
      checked = true;
      if (qs.empty) { await commitOps(seedItemObjs().map(i => ['set', pref('items', i.id), i])); return; }
    }
    S.items = qs.docs.map(d => d.data()); mark('items');
  }, onErr('items')));
  unsubs.push(F.onSnapshot(pcol('events'), qs => { S.cev = qs.docs.map(d => ({ ...d.data(), area: 'c' })); mark('cev'); }, onErr('cev')));
}
function afterReady() {
  render();
  initNotifications();
  const cutoff = addDays(today(), -365);   // 1년 지난 할 일 정리 (기존 플래너와 같음)
  Object.keys(S.todos).filter(d => d < cutoff).forEach(d => F.deleteDoc(uref('todos', d)).catch(() => {}));
}
async function login() {
  const prov = new Au.GoogleAuthProvider();
  try { await Au.signInWithPopup(auth, prov); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) await Au.signInWithRedirect(auth, prov);
    else if (e.code !== 'auth/popup-closed-by-user') toast('로그인 실패: ' + e.code);
  }
}
async function commitOps(ops) {   // [['set'|'merge'|'del', ref, data]] 를 400개씩 나눠 저장
  for (let i = 0; i < ops.length; i += 400) {
    const b = F.writeBatch(db);
    ops.slice(i, i + 400).forEach(([t, r, d]) => t === 'del' ? b.delete(r) : t === 'merge' ? b.set(r, clean(d), { merge: true }) : b.set(r, clean(d)));
    await b.commit();
  }
}
const fail = msg => err => toast(`${msg}: ${err.code || err.message}`);

/* ---------- 저장 ---------- */
function saveEv(e, rerender = true) {
  e.updated = Date.now();
  upsert(e.area === 'c' ? S.cev : S.pev, e);
  if (rerender) render();
  const { area, ...data } = e;
  F.setDoc(evRef(e), clean({ ...data, area })).catch(fail('저장 실패'));
}
function delEv(e) {
  if (e.area === 'c') S.cev = S.cev.filter(x => x.id !== e.id); else S.pev = S.pev.filter(x => x.id !== e.id);
  F.deleteDoc(evRef(e)).catch(fail('삭제 실패'));
}
function moveEv(e, area) {   // 개인 ↔ 회중 옮기기 (새 위치에 쓰고 옛 위치를 지움, 한 번에)
  const oldRef = evRef(e);
  if (e.area === 'c') S.cev = S.cev.filter(x => x.id !== e.id); else S.pev = S.pev.filter(x => x.id !== e.id);
  e.area = area; e.updated = Date.now();
  upsert(area === 'c' ? S.cev : S.pev, e);
  commitOps([['set', evRef(e), e], ['del', oldRef]]).catch(fail('옮기기 실패'));
}
function saveTodos(date) {
  const items = S.todos[date] || [];
  if (!items.length) F.deleteDoc(uref('todos', date)).catch(() => {});
  else F.setDoc(uref('todos', date), clean({ date, items })).catch(fail('저장 실패'));
}
function saveMemo(m) { upsert(S.memos, m); F.setDoc(uref('memos', m.id), clean(m)).catch(fail('저장 실패')); }
function saveItem(it) { upsert(S.items, it); F.setDoc(pref('items', it.id), clean(it)).catch(fail('저장 실패')); }
function saveProfile(patch) { Object.assign(S.profile, patch); F.setDoc(uref(), clean(patch), { merge: true }).catch(fail('저장 실패')); }

/* 자동 제목 */
function autoTitle(it, start, slot) {
  if (it.slotType) return `${it.name} (${slot || slotByDate(it.slotType, start)})`;
  return it.name;
}
function retitle(e) {   // 날짜를 바꿔 칸이 바뀌면 "순회방문 (상반기)" 같은 자동 제목도 바꿈
  const it = itemOf(e.itemId); if (!it || !it.slotType) return;
  const re = new RegExp('^' + rx(it.name) + ' \\((상반기|하반기|가을|봄)\\)$');
  if (re.test(e.title)) e.title = `${it.name} (${slotOf(e)})`;
}
function renumber(it, sy) {   // "정기장로모임 2차" 같은 자동 제목을 봉사연도 안 날짜 순서로 다시 매김
  if (!it || it.slotType || !(it.times > 1)) return;
  const re = new RegExp('^' + rx(it.name) + ' \\d+차$');
  congOf(it.id, sy).forEach((x, i) => {
    const t = `${it.name} ${i + 1}차`;
    if (re.test(x.title) && x.title !== t) { x.title = t; saveEv(x, false); }
  });
}

/* ---------- 렌더 제어 ---------- */
let pending = false;
function typing() { const a = document.activeElement; return a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !['checkbox', 'button', 'submit'].includes(a.type); }
function scheduleRender(remote) { if (S.phase !== 'ready') return; if (remote && typing()) { pending = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) { pending = false; render(); } }, 0));

/* 뒤로 가기: 앱 안에서 이동했으면 브라우저 뒤로, 아니면 정해진 화면으로 */
const stack = [location.hash || '#home'];
let replacing = false;
function nav(h, replace) {
  if (replace) { replacing = true; stack[stack.length - 1] = h; location.replace(h); }
  else location.hash = h;
}
window.addEventListener('hashchange', () => {
  const h = location.hash || '#home';
  if (replacing) replacing = false;
  else if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
  else stack.push(h);
  window.scrollTo(0, 0);
  render();
});
function goBack(fallback) { if (stack.length > 1) history.back(); else nav(fallback, true); }
const topbar = (title, fallback, right = '') => `<div class="topbar"><a href="${fallback}" class="icon-btn ghost" data-back="${fallback}" aria-label="뒤로">${ico.back}</a><div style="font-weight:600">${title}</div>${right || '<span style="width:44px"></span>'}</div>`;
const notFound = () => topbar('', '#home') + `<div class="card empty">찾을 수 없습니다. 삭제되었을 수 있습니다.</div>`;

   화면: 달력 (연 · 월 · 주 · 목록)

function calEvents() { const f = S.cal.filter; return allEv().filter(e => e.start && (f === 'all' || e.area === f)); }
function tagHtml(e) {
  const c = chipStyle(e);
  return `<span class="tag ${e.done ? 'done-t' : ''}" style="background:${c.bg};color:${c.fg}">${esc(e.title)}</span>`;
}
function evRow(e) {

  const right = e.area === 'c' ? chip(evState(e)) : `<span class="chip" style="background:${c.bg};color:${c.fg}">${esc(e.cat || '개인')}</span>`;
  const extra = e.area === 'c' && slotOf(e) ? ` · ${slotOf(e)}` : '';
  return `<a href="#ev/${e.area}/${encodeURIComponent(e.id)}" class="card evrow">
    <span class="bar6" style="background:${c.bar}"></span>

    <span class="sub ellipsis" style="font-size:12px">${e.area === 'c' ? '회중 · ' : ''}${span(e)}${extra}${e.place ? ' · ' + esc(e.place) : ''}</span></span>${right}</a>`;
}
function viewCal() {

  </div>`;

    for (let i = 0; i < cells; i++) {

      const de = evs.filter(e => onDate(e, d)).sort(byStart);

        <span class="d ${dd.getDay() === 0 ? 'sun' : ''}"><span>${dd.getDate()}</span></span>
        ${de.slice(0, 2).map(tagHtml).join('')}${de.length > 2 ? `<span class="sub" style="font-size:9px;text-align:center">+${de.length - 2}</span>` : ''}</button>`;
    }
    h += `</div></div>`;
    const sel = evs.filter(e => onDate(e, c.sel)).sort(byStart);
    h += `<div class="between"><h2 class="h2">${md(c.sel)}</h2><a class="btn small" href="#new/p?d=${c.sel}">+ 이 날 일정</a></div>`;
    h += sel.length ? `<div class="list">${sel.map(evRow).join('')}</div>` : `<div class="card empty">이 날 일정이 없습니다</div>`;
  } else if (c.mode === 'week') {
    const s = addDays(c.cursor, -cur.getDay());
    h += `<div class="list">`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(s, i), dd = parse(d);
      const de = evs.filter(e => onDate(e, d)).sort(byStart);
      h += `<div class="card row" style="gap:12px;align-items:flex-start;${d === t ? 'outline:2px solid var(--acc);outline-offset:-2px' : ''}">
        <a href="#new/p?d=${d}" style="width:40px;text-align:center;flex:none;text-decoration:none;color:var(--ink)" aria-label="${dd.getMonth() + 1}월 ${dd.getDate()}일에 일정 추가"><div class="sub ${i === 0 ? 'sun' : ''}" style="font-size:11px">${DOW[i]}</div><div style="font-size:18px;font-weight:700">${dd.getDate()}</div></a>
        <div class="grow col" style="gap:6px;justify-content:center;min-height:44px">${de.length ? de.map(e => { const cs = chipStyle(e); return `<a href="#ev/${e.area}/${encodeURIComponent(e.id)}" class="row" style="text-decoration:none;color:var(--ink);min-height:34px;gap:8px"><span style="width:8px;height:8px;border-radius:99px;background:${cs.bar};flex:none"></span><span class="ellipsis grow ${e.done ? 'done-t' : ''}" style="font-size:14px">${esc(e.title)}</span>${e.area === 'c' ? chip(evState(e)) : ''}</a>`; }).join('') : '<span class="mute" style="font-size:14px">—</span>'}</div></div>`;
    }
    h += `</div>`;
  } else if (c.mode === 'year') {
    const yy = cur.getFullYear(), nowM = new Date().getFullYear() === yy ? new Date().getMonth() : -1;
    h += `<div class="years">`;
    for (let m = 0; m < 12; m++) {
      const ms = `${yy}-${pad(m + 1)}-01`, me = ymd(new Date(yy, m + 1, 0));
      const me2 = evs.filter(e => e.start <= me && endOf(e) >= ms).sort(byStart);
      h += `<button data-act="pickmonth" data-m="${m}" class="${m === nowM ? 'now' : ''}" aria-label="${m + 1}월 일정 ${me2.length}건"><span style="font-weight:700">${m + 1}월</span>
        ${me2.slice(0, 3).map(e => { const cs = chipStyle(e); return `<span class="it" style="background:${cs.bg};color:${cs.fg}">${esc(e.title)}</span>`; }).join('')}
        ${me2.length > 3 ? `<span class="sub" style="font-size:11px">+${me2.length - 3}</span>` : ''}</button>`;
    }

  } else {

      h += evRow(e);
    });
    if (curM) h += `</div>`;
  }
  return h + `<a class="fab" href="#new/${c.filter === 'c' ? 'c' : 'p'}?d=${c.mode === 'month' ? c.sel : today()}" aria-label="새 일정 추가">${ico.plus}</a>`;
}

/* =====================================================================

function windowAlerts() {   // 기존 플래너 규칙: 시작 전날 18시 ~ 종료일 끝까지
  const now = Date.now(), t = today();
  const at = (s, h, m = 0, sec = 0) => { const [y, mo, d] = s.split('-').map(Number); return new Date(y, mo - 1, d, h, m, sec).getTime(); };
  return allEv().filter(e => !e.done && e.start && now >= at(e.start, 18) - 86400000 && now <= at(endOf(e), 23, 59, 59))
    .map(e => ({ e, tag: t < e.start ? 'tomorrow' : 'today' })).sort((a, b) => byStart(a.e, b.e));
}
const prepAlerts = () => S.cev.filter(e => !e.done && ['prep', 'late'].includes(evState(e))).sort(byStart);
function prepCard(list, title) {

    h += `<a href="#ev/c/${encodeURIComponent(e.id)}" class="row" style="gap:12px">
      <div class="dday ${s === 'late' ? 'late' : ''}"><small>${lab}</small><b>${mdShort(e.start)}</b></div>
      <div class="grow"><div style="font-weight:600" class="ellipsis">${esc(e.title)}</div>
      <div class="sub ellipsis">${s === 'late' ? '날짜가 지났습니다 · 완료 처리 또는 기록 정리' : `준비 ${doneCount(e)}/${(e.checklist || []).length} 완료`}</div></div></a>`;
  });
  if (list.length > 5) h += `<div class="sub">외 ${list.length - 5}건</div>`;
  return h + `</section>`;
}
function viewToday() {

/* =====================================================================
   화면: 회중 (봉사연도 기준)
   ===================================================================== */
function groupSummary(items, sy) {
  let expected = 0, sched = 0, done = 0, prep = false, late = false, nextDate = null;
  const t = today();
  items.forEach(it => {
    expected += it.times || 0;
    congOf(it.id, sy).forEach(e => {
      sched++;
      const s = evState(e);
      if (s === 'done') done++; if (s === 'prep') prep = true; if (s === 'late') late = true;
      if (!e.done && e.start >= t && (!nextDate || e.start < nextDate)) nextDate = e.start;
    });
  });
  let st;
  if (late) st = 'late'; else if (prep) st = 'prep';
  else if (expected > 0 && done >= expected) st = 'done';
  else if (sched > 0) st = 'set'; else st = expected === 0 ? 'any' : 'none';
  const base = expected || sched;
  return { st, pct: base ? Math.min(100, Math.round(done / base * 100)) : 0, nextDate, count: expected ? `${done}/${expected}` : (sched ? `${done}/${sched}` : '') };
}
function congHeader(sub) {

    </div>

  </div>

}

function viewEvent(area, id) {

    ${it?.slotType === 'season' ? `<label class="kv"><span class="sub">구분</span><select data-f="slot"><option value="">날짜로 자동 (${seasonOf(e.start)})</option>${SLOTS.season.map(s => `<option value="${s}" ${e.slot === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}

  </div>`;
  // 시간표
  h += `<div class="between"><h2 class="h2">시간표</h2><button class="btn small" data-act="tl-add">+ 추가</button></div>`;
  const tl = e.timeline || [];
  h += tl.length ? `<div class="card" style="padding:2px 10px">${tl.map((x, i) => `<div class="line ${x.done ? 'done' : ''}">
      <label class="sr" for="tlm${i}">시간</label><input id="tlm${i}" class="tm" data-tl="${i}" data-k="time" value="${esc(x.time || '')}" placeholder="09:00">
      <label class="sr" for="tlx${i}">내용</label><input id="tlx${i}" class="t" data-tl="${i}" data-k="text" value="${esc(x.text || '')}" placeholder="내용">
      <input type="checkbox" data-chk="tl" data-i="${i}" ${x.done ? 'checked' : ''} aria-label="완료">
      <button class="icon-btn ghost" data-act="tl-del" data-i="${i}" aria-label="삭제">${ico.x}</button></div>`).join('')}</div>` : `<div class="sub">시간대별 진행 순서가 있으면 추가하세요.</div>`;
  // 체크리스트 / 준비사항
  const cl = e.checklist || [];
  h += `<div class="between"><h2 class="h2">${area === 'c' ? '준비사항' : '체크리스트'}</h2><span class="sub">${doneCount(e)} / ${cl.length}</span></div>
  <div class="card" style="padding:2px 10px">${cl.map((x, i) => `<div class="line ${x.done ? 'done' : ''}">

      <label class="sr" for="cl${i}">항목</label><input id="cl${i}" class="t" data-cl="${i}" value="${esc(x.text || '')}">

    <form data-form="cl" class="row" style="padding:8px 0;gap:8px"><label class="sr" for="newcl">항목 추가</label>
      <input id="newcl" name="t" class="inp" placeholder="${area === 'c' ? '준비사항 추가' : '체크 항목 추가'}" style="min-height:44px">
      <button class="icon-btn" type="submit" style="background:var(--acc);color:#fff" aria-label="추가">${ico.plus}</button></form></div>`;
  // 문서
  const docs = e.docs || [];
  h += `<div class="between"><h2 class="h2">문서</h2><a class="btn small" href="#doc/${area}/${encodeURIComponent(e.id)}/new">+ 문서</a></div>`;
  h += docs.length ? `<div class="list">${docs.map(d => `<a href="#doc/${area}/${encodeURIComponent(e.id)}/${encodeURIComponent(d.id)}" class="card row" style="text-decoration:none;color:var(--ink)">${ico.doc}<span class="grow ellipsis" style="font-weight:600">${esc(d.title || '문서')}</span><span class="sub">${d.date ? mdShort(d.date) : ''}</span></a>`).join('')}</div>` : `<div class="sub">회의록, 계획표 같은 문서를 일정에 붙여 둘 수 있습니다.</div>`;
  // 메모
  h += `<label class="field" style="margin-top:4px"><span class="h2" style="color:var(--ink)">메모</span>
    <textarea data-f="note" class="inp" rows="4" placeholder="협의 내용, 연락처, 다음에 참고할 점 등">${esc(e.note || '')}</textarea></label>`;
  // 지난 기록 (회중)
  if (area === 'c') {
    const past = S.cev.filter(x => x.itemId === e.itemId && x.id !== e.id && x.done)
      .sort((p, q) => ((slotOf(q) === slot) - (slotOf(p) === slot)) || q.start.localeCompare(p.start)).slice(0, 5);
    if (past.length) {
      h += `<h2 class="h2">지난 기록</h2><div class="list">${past.map(p => `<a href="#ev/c/${encodeURIComponent(p.id)}" class="card row" style="text-decoration:none;color:var(--ink);gap:12px">
        <div style="width:48px;text-align:center;color:var(--ok-d);flex:none"><div style="font-size:11px">${syOf(p.start)}</div><div style="font-weight:700;font-size:14px">${slotOf(p) || (parse(p.start).getMonth() + 1) + '월'}</div></div>
        <div class="grow"><div style="font-weight:600;font-size:14px" class="ellipsis">${esc(p.title)}</div><div class="sub ellipsis" style="font-size:12px">${p.note ? esc(p.note.split('\n')[0]) : `${span(p)} · 준비 ${doneCount(p)}/${(p.checklist || []).length}`}</div></div>${ico.next}</a>`).join('')}</div>`;
    }
  }
  h += `<div class="col" style="margin-top:18px">`;
  if (area === 'c') h += e.done
    ? `<div class="sub" style="text-align:center">${e.doneAt ? new Date(e.doneAt).toLocaleDateString('ko-KR') + ' 에 ' : ''}기록보관됨</div><button class="btn block" data-act="undone">기록보관 해제 (다시 진행중으로)</button>`
    : `<button class="btn primary block" data-act="done">완료 후 기록보관</button>`;
  else h += `<button class="btn ${e.done ? '' : 'primary'} block" data-act="${e.done ? 'undone' : 'done'}">${e.done ? '처리완료 해제' : '처리완료'}</button>`;
  h += `<button class="btn danger block" data-act="delevent">이 일정 삭제</button></div>`;
  return h;
}

      <div class="sub">예전 연간 플래너의 데이터는 그대로 남아 있습니다. 새 앱에서 내용을 확인하신 뒤 보안 규칙에서 예전 데이터 접근을 막아 주세요.</div></div>
      <a class="btn primary block" style="margin-top:14px" href="#home">달력 보기</a>
      <a class="btn block" style="margin-top:10px" href="#cong">회중 탭 보기</a>`;

    <div class="sub">제목의 낱말로 자동 분류했습니다. <b>틀린 것만 바꿔 주세요.</b> 시간표, 체크리스트, 문서, 메모, 처리완료 표시는 그대로 옮겨집니다.</div>
  </div>
  <div class="card" style="padding:2px 14px;margin-bottom:14px">`;
  rows.forEach((r, i) => {

  <button class="btn block" style="margin-top:10px" data-act="mig-cancel">취소</button>`;
  return h;
}
async function migLogin(id, pw) {
  S.mig = { step: 'login', oldId: id, busy: true }; render();
  try {
    if (id === 'master') throw new Error('마스터 계정이 아닌, 일정을 쓰던 개인 아이디를 입력해 주세요.');
    const meta = await F.getDoc(F.doc(db, 'planner', 'meta'));
    if (!meta.exists()) throw new Error('예전 연간 플래너 데이터를 찾지 못했습니다.');
    const u = (meta.data().users || []).find(x => x.id === id && x.pw === pw);
    if (!u) throw new Error('아이디 또는 비밀번호가 맞지 않습니다.');
    const snap = await F.getDoc(F.doc(db, 'planner', 'user_' + id));
    if (!snap.exists()) throw new Error('이 아이디의 일정 데이터가 없습니다.');
    const d = snap.data();
    const evs = d.events || [];
    S.mig = { step: 'preview', oldId: id, name: u.name || id, d, skipped: evs.filter(e => !e.start).length,
      rows: evs.filter(e => e.start).sort(byStart).map(ev => ({ ev, target: classify(ev) })) };
  } catch (err) {
    const msg = err.code === 'permission-denied' ? '보안 규칙이 예전 데이터 읽기를 막고 있습니다. firestore.rules의 「예전 연간 플래너」 부분이 들어 있는지 확인해 주세요.'
      : err.code === 'unavailable' ? '인터넷에 연결된 상태에서 다시 시도해 주세요.' : err.message;
    S.mig = { step: 'login', oldId: id, error: msg };
  }
  render();
}
async function migRun() {
  const m = S.mig; if (!m || m.busy) return;
  m.busy = true; render();
  try {
    const d = m.d, now = Date.now();
    const docsById = new Map((d.docs || []).map(x => [x.id, x])), used = new Set();
    const ops = []; let np = 0, nc = 0;
    m.rows.forEach(({ ev: o, target }) => {
      const docs = (o.docs || []).map(id => { used.add(id); return docsById.get(id); }).filter(Boolean)
        .map(x => ({ id: x.id || newId(), title: x.title || '문서', date: x.date || '', body: x.body || '', checklist: x.checklist || [] }));
      const base = { id: o.id || newId(), title: o.title || '(제목없음)', start: o.start, end: o.end && o.end > o.start ? o.end : '', place: o.place || '',
        done: !!o.done, doneAt: o.done ? now : null, timeline: o.timeline || [], checklist: o.checklist || [], docs, note: o.quickNote || '',
        created: now, updated: now, from: 'k-planner' };
      if (target === 'p') { np++; ops.push(['set', uref('events', base.id), { ...base, area: 'p', cat: o.cat || '' }]); }
      else {
        nc++; const it = itemOf(target);
        const checklist = base.checklist.length || base.done ? base.checklist : (it?.prep || []).map(t => ({ text: t, done: false }));   // 비어 있으면 항목의 기본 준비사항
        ops.push(['set', pref('events', base.id), { ...base, checklist, area: 'c', itemId: target, slot: null, leadDays: it?.leadDays ?? null }]);
      }
    });
    let todoDays = 0;
    Object.entries(d.dailyTodos || {}).forEach(([date, items]) => { if (Array.isArray(items) && items.length) { todoDays++; ops.push(['set', uref('todos', date), { date, items }]); } });
    (d.memos || []).forEach(x => ops.push(['set', uref('memos', x.id || newId()), { id: x.id, title: x.title || '', body: x.body || '', updatedAt: x.updatedAt || now }]));
    let orphan = 0;
    (d.docs || []).filter(x => !used.has(x.id)).forEach(x => {   // 일정에 붙어 있지 않던 문서는 메모로
      orphan++;
      const body = [x.date || '', x.body || '', ...(x.checklist || []).map(c => `${c.done ? '☑' : '☐'} ${c.text}`)].filter(Boolean).join('\n');
      ops.push(['set', uref('memos', 'doc_' + x.id), { id: 'doc_' + x.id, title: x.title || '문서', body, updatedAt: now }]);
    });
    const result = { personal: np, cong: nc, todoDays, memos: (d.memos || []).length + orphan, skipped: m.skipped };
    const prof = { migrated: { from: m.oldId, at: now, personal: np, cong: nc } };
    if (Array.isArray(d.categories) && d.categories.length) prof.categories = [...new Set([...d.categories, ...(S.profile.categories || [])])];
    ops.push(['merge', uref(), prof]);
    await commitOps(ops);
    S.mig = { step: 'done', result };
  } catch (err) {
    m.busy = false; toast('옮기기 실패: ' + (err.code || err.message));
  }
  render();
}

async function importJSON(d) {
  const ops = [];
  if (d.app === 'elder-planner') {   // 엘더플래너 v0.1 백업
    const oldItems = new Map((d.items || []).map(i => [i.id, i]));
    (d.events || []).forEach(e => {
      if (!e.start) return;
      const name = oldItems.get(e.itemId)?.name;
      const target = (ELDER_MAP[e.itemId] && itemOf(ELDER_MAP[e.itemId])) ? ELDER_MAP[e.itemId] : (S.items.find(i => i.name === name)?.id || 'unc');
      ops.push(['set', pref('events', e.id), { id: e.id, area: 'c', itemId: target, slot: null, title: e.title || name || '회중 일정', start: e.start, end: e.end || '',
        place: e.place || '', leadDays: e.leadDays ?? null, done: !!e.done, doneAt: e.doneAt || null, timeline: [],
        checklist: (e.tasks || []).map(t => ({ text: t.t, done: !!t.done })), docs: [], note: e.memo || '', created: e.created || Date.now(), updated: Date.now() }]);
    });
  } else if (d.app === 'elder-planner-unified') {
    (d.items || []).forEach(i => ops.push(['set', pref('items', i.id), i]));
    (d.personalEvents || []).forEach(e => ops.push(['set', uref('events', e.id), { ...e, area: 'p' }]));
    (d.congEvents || []).forEach(e => ops.push(['set', pref('events', e.id), { ...e, area: 'c' }]));
    Object.entries(d.todos || {}).forEach(([date, items]) => { if (items.length) ops.push(['set', uref('todos', date), { date, items }]); });
    (d.memos || []).forEach(m => ops.push(['set', uref('memos', m.id), m]));
    if (Array.isArray(d.categories) && d.categories.length) ops.push(['merge', uref(), { categories: d.categories }]);
  } else throw new Error('이 앱이나 엘더플래너의 백업 파일이 아닙니다');
  if (!confirm(`${ops.length}개 항목을 불러올까요?`)) return;
  await commitOps(ops);
  toast('불러오기 완료');
}

let notifTimer;
function initNotifications() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(() => { sendNotifications(); render(); });
  sendNotifications();
  clearInterval(notifTimer);
  notifTimer = setInterval(() => { scheduleRender(false); sendNotifications(); }, 60 * 60 * 1000);
}
async function showNotif(body, tag) {
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) await reg.showNotification(APP_NAME, { body, tag, icon: 'icon-192.png' });
    else new Notification(APP_NAME, { body, tag });
  } catch (e) { /* 지원하지 않는 기기 */ }
}
function sendNotifications() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  let log = {};
  try { log = JSON.parse(localStorage.getItem('ep_notif_sent') || '{}'); } catch (e) {}
  const t = today();
  windowAlerts().forEach(({ e, tag }) => {
    const key = `${t}_${e.id}`; if (log[key]) return;
    showNotif(tag === 'tomorrow' ? `내일(${mdShort(e.start)}) 일정: ${e.title}` : `오늘 일정: ${e.title}`, key); log[key] = t;
  });
  S.cev.filter(e => !e.done && evState(e) === 'prep' && alertDate(e)).forEach(e => {
    const key = `prep_${e.id}_${alertDate(e)}`; if (log[key]) return;
    showNotif(`준비 시작: ${e.title} (${md(e.start)})`, key); log[key] = t;
  });
  const cutoff = addDays(t, -60);
  Object.keys(log).forEach(k => { if (log[k] < cutoff) delete log[k]; });
  try { localStorage.setItem('ep_notif_sent', JSON.stringify(log)); } catch (e) {}
}

function route() {
  const h = location.hash.slice(1) || 'home';
  const [path, qs] = h.split('?');
  return { parts: path.split('/').map(decodeURIComponent), q: new URLSearchParams(qs || '') };
}
function render() {
  const tabs = document.getElementById('tabs');
  if (S.phase !== 'ready') {
    tabs.hidden = true;
    if (S.phase === 'login') $app.innerHTML = `<div class="login">
      <div><img src="icon-192.png" alt="" width="72" height="72" style="border-radius:18px"></div>
      <div><div class="eyebrow">ELDER PLANNER</div><h1 class="h1" style="font-size:28px">${APP_NAME}</h1><div class="sub" style="margin-top:6px">개인 일정과 회중 일정을 한 달력에서</div></div>
      <button class="btn primary block" data-act="login">Google 계정으로 로그인</button>
      <div class="sub">예전 연간 플래너의 아이디·비밀번호는 로그인 후<br>설정 › 기존 데이터 가져오기에서 한 번만 사용합니다.</div></div>`;
    else if (S.phase === 'error') $app.innerHTML = `<div class="login"><h1 class="h1">연결 오류</h1><div class="card sub">${esc(S.err)}</div><button class="btn block" data-act="reload">다시 시도</button></div>`;
    else $app.innerHTML = `<div class="login"><div class="sub">불러오는 중…</div></div>`;
    return;
  }
  tabs.hidden = false;
  const { parts, q } = route();
  const [r, a1, a2, a3] = parts;
  let html, tab = 'home';
  switch (r) {
    case 'today': html = viewToday(); tab = 'today'; break;
    case 'cong': html = viewCong(a1); tab = 'cong'; break;
    case 'group': html = viewGroup(a1); tab = 'cong'; break;
    case 'new': html = viewNew(a1 === 'c' ? 'c' : 'p', a2, q); tab = a1 === 'c' ? 'cong' : 'home'; break;
    case 'ev': html = viewEvent(a1, a2); tab = a1 === 'c' ? 'cong' : 'home'; break;
    case 'doc': html = viewDoc(a1, a2, a3); tab = a1 === 'c' ? 'cong' : 'home'; break;
    case 'memo': html = a1 ? viewMemo(a1) : viewMemos(); tab = 'memo'; break;
    case 'settings': html = viewSettings(); tab = 'settings'; break;
    case 'item': html = viewItem(a1); tab = 'settings'; break;
    case 'migrate': html = viewMigrate(); tab = 'settings'; break;
    default: html = viewCal();
  }
  document.querySelectorAll('#tabs a').forEach(x => { const on = x.dataset.tab === tab; x.classList.toggle('on', on); if (on) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
  document.getElementById('todayDot').hidden = !(windowAlerts().length || prepAlerts().length);
  $app.innerHTML = html;
}

const curEv = () => { const { parts } = route(); return (parts[0] === 'ev' || parts[0] === 'doc') ? findEv(parts[1], parts[2]) : null; };

$app.addEventListener('click', ev => {
  const back = ev.target.closest('[data-back]');
  if (back) { ev.preventDefault(); goBack(back.dataset.back); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act, e = curEv(), c = S.cal;
  switch (act) {
    case 'login': login(); break;
    case 'reload': location.reload(); break;
    case 'logout': if (confirm('로그아웃할까요?')) Au.signOut(auth); break;
    /* 달력 */
    case 'calmode': c.mode = el.dataset.m; render(); break;
    case 'filter': c.filter = el.dataset.f; render(); break;
    case 'caltoday': c.cursor = c.sel = today(); render(); break;
    case 'cal': {
      const d = +el.dataset.d, cur = parse(c.cursor);
      if (c.mode === 'week') c.cursor = addDays(c.cursor, 7 * d);
      else if (c.mode === 'month') { c.cursor = ymd(new Date(cur.getFullYear(), cur.getMonth() + d, 1)); c.sel = c.cursor.slice(0, 7) === today().slice(0, 7) ? today() : c.cursor; }
      else c.cursor = ymd(new Date(cur.getFullYear() + d, 0, 1));
      render(); break;
    }
    case 'selday': c.sel = el.dataset.d; render(); break;
    case 'pickmonth': { const cur = parse(c.cursor); c.cursor = c.sel = ymd(new Date(cur.getFullYear(), +el.dataset.m, 1)); c.mode = 'month'; render(); break; }
    /* 오늘 */
    case 'tdate': S.todoDate = addDays(S.todoDate, +el.dataset.d); S.openNote = null; render(); break;
    case 'ttoday': S.todoDate = today(); render(); break;
    case 'todo-del': { const arr = S.todos[S.todoDate] || []; arr.splice(+el.dataset.i, 1); S.todos[S.todoDate] = arr; saveTodos(S.todoDate); render(); break; }
    case 'todo-note': { const x = (S.todos[S.todoDate] || [])[+el.dataset.i]; if (x) { S.openNote = S.openNote === x.id ? null : x.id; render(); } break; }
    /* 회중 */
    case 'sy': S.sy += +el.dataset.d; render(); break;
    /* 일정 상세 */
    case 'tl-add': e.timeline = e.timeline || []; e.timeline.push({ time: '', text: '', done: false }); saveEv(e); document.getElementById('tlm' + (e.timeline.length - 1))?.focus(); break;
    case 'tl-del': e.timeline.splice(+el.dataset.i, 1); saveEv(e); break;
    case 'cl-del': e.checklist.splice(+el.dataset.i, 1); saveEv(e); break;
    case 'done': e.done = true; e.doneAt = Date.now(); saveEv(e); toast(e.area === 'c' ? '기록보관했습니다' : '처리완료'); break;
    case 'undone': e.done = false; e.doneAt = null; saveEv(e); break;
    case 'delevent':
      if (confirm('이 일정을 삭제할까요? 시간표, 체크리스트, 문서, 메모도 함께 지워집니다.')) { delEv(e); goBack(e.area === 'c' ? '#cong' : '#home'); }
      break;
    /* 문서 */
    case 'dcl-add': document.getElementById('dcl').insertAdjacentHTML('beforeend', dclRow()); document.querySelector('#dcl [data-dcl]:last-child .t').focus(); break;
    case 'dcl-del': el.closest('[data-dcl]').remove(); break;
    case 'deldoc': {
      const f = el.closest('form'); const host = findEv(f.dataset.area, f.dataset.ev);
      if (host && confirm('이 문서를 삭제할까요?')) { host.docs = (host.docs || []).filter(x => x.id !== f.dataset.doc); saveEv(host, false); goBack(`#ev/${host.area}/${encodeURIComponent(host.id)}`); }
      break;
    }
    /* 메모 */
    case 'delmemo': {
      const id = el.closest('form').dataset.id;
      if (confirm('이 메모를 삭제할까요?')) { S.memos = S.memos.filter(x => x.id !== id); F.deleteDoc(uref('memos', id)).catch(fail('삭제 실패')); goBack('#memo'); }
      break;
    }
    /* 설정 */
    case 'addcat': { const l = document.getElementById('catlist'); l.insertAdjacentHTML('beforeend', catRow('', l.children.length)); l.lastElementChild.querySelector('.t').focus(); break; }
    case 'delcat': el.closest('[data-cat]').remove(); break;
    case 'delitem': {
      const id = el.closest('form').dataset.id;
      if (confirm('이 항목을 삭제할까요?')) { S.items = S.items.filter(x => x.id !== id); F.deleteDoc(pref('items', id)).catch(fail('삭제 실패')); nav('#settings', true); }
      break;
    }
    case 'notif': Notification.requestPermission().then(() => { sendNotifications(); render(); }); break;
    case 'export': exportJSON(); break;
    case 'import': document.getElementById('importFile').click(); break;
    /* 가져오기 */
    case 'mig-run': migRun(); break;
    case 'mig-cancel': S.mig = null; nav('#settings', true); break;
  }
});

$app.addEventListener('change', ev => {
  const el = ev.target, e = curEv();
  /* 체크박스 */
  if (el.dataset.chk) {
    const k = el.dataset.chk;

  }

  if (el.dataset.todonote !== undefined) { const x = (S.todos[S.todoDate] || [])[+el.dataset.todonote]; if (x) { x.note = el.value; saveTodos(S.todoDate); } return; }
  if (el.dataset.tl !== undefined && e) { e.timeline[+el.dataset.tl][el.dataset.k] = el.value; saveEv(e, false); return; }
  if (el.dataset.cl !== undefined && e) { const v = el.value.trim(); if (v) { e.checklist[+el.dataset.cl].text = v; saveEv(e, false); } else el.value = e.checklist[+el.dataset.cl].text; return; }
  if (el.name === 'cls' && el.form?.dataset.form === 'new' && el.form.dataset.area === 'c') { const it = itemOf(el.value); if (it) el.form.lead.value = it.leadDays ?? ''; return; }
  const f = el.dataset.f;
  if (!f || !e) return;
  let v = el.value;
  switch (f) {
    case 'title': if (!v.trim()) { el.value = e.title; return; } e.title = v.trim(); saveEv(e, false); return;
    case 'start': {
      if (!v) { el.value = e.start; return; }
      const oldSy = syOf(e.start);
      e.start = v; if (e.end && e.end < v) e.end = '';
      if (e.area === 'c') { retitle(e); const it = itemOf(e.itemId); renumber(it, oldSy); if (syOf(v) !== oldSy) renumber(it, syOf(v)); else renumber(it, oldSy); }
      saveEv(e); return;
    }
    case 'end': if (v && v < e.start) { toast('종료일이 시작일보다 빠릅니다'); el.value = e.end || ''; return; } e.end = v; saveEv(e); return;
    case 'place': e.place = v; saveEv(e, false); return;
    case 'note': e.note = v; saveEv(e, false); return;
    case 'leadDays': e.leadDays = v === '' ? null : +v; saveEv(e); return;
    case 'slot': e.slot = v || null; retitle(e); saveEv(e); return;
    case 'class': {
      const [area, val] = [v.slice(0, 1), v.slice(2)];
      if (area === 'p') e.cat = val;
      else if (e.itemId !== val || e.area !== 'c') {
        const it = itemOf(val);
        e.itemId = val; e.slot = null; e.leadDays = it?.leadDays ?? null;
        if (it && !(e.checklist || []).length) e.checklist = it.prep.map(t => ({ text: t, done: false }));
      }
      if (area !== e.area) { moveEv(e, area); nav(`#ev/${area}/${encodeURIComponent(e.id)}`, true); toast(area === 'c' ? '회중 일정으로 옮겼습니다' : '개인 일정으로 옮겼습니다'); }
      else saveEv(e);
      return;
    }
  }
});

$app.addEventListener('input', ev => {
  if (ev.target.dataset.act === 'recq') {
    S.recQ = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const n = document.getElementById('recq'); n.focus(); n.setSelectionRange(pos, pos);
  }
});

$app.addEventListener('submit', ev => {
  ev.preventDefault();
  const form = ev.target, fd = new FormData(form), kind = form.dataset.form;
  const e = curEv();
  if (kind === 'new') {
    const area = form.dataset.area, start = fd.get('start'), end = fd.get('end');
    if (end && end < start) { toast('종료일이 시작일보다 빠릅니다'); return; }
    const base = { id: 'e' + newId(), area, start, end: end || '', place: fd.get('place').trim(), done: false, doneAt: null,
      timeline: [], checklist: [], docs: [], note: '', created: Date.now() };
    let x;
    if (area === 'p') x = { ...base, title: fd.get('title').trim(), cat: fd.get('cls') };
    else {
      const it = itemOf(fd.get('cls'));
      const want = form.dataset.slot;
      let slot = null;
      if (it.slotType === 'season' && want && SLOTS.season.includes(want) && seasonOf(start) !== want) slot = want;
      if (it.slotType === 'half' && want && halfOf(start) !== want) toast(`날짜상 ${halfOf(start)} 일정으로 들어갑니다`);
      const lead = fd.get('lead');
      x = { ...base, itemId: it.id, slot, leadDays: lead === '' ? null : +lead, checklist: it.prep.map(t => ({ text: t, done: false })),
        title: fd.get('title').trim() || autoTitle(it, start, slot) + (!it.slotType && it.times > 1 ? ' 1차' : '') };
      S.sy = syOf(start);
    }
    saveEv(x, false);
    if (area === 'c') renumber(itemOf(x.itemId), syOf(start));
    nav(`#ev/${area}/${encodeURIComponent(x.id)}`, true);
  } else if (kind === 'cl' && e) {
    const t = fd.get('t').trim(); if (!t) return;
    e.checklist = e.checklist || []; e.checklist.push({ text: t, done: false }); saveEv(e);
    document.getElementById('newcl')?.focus();
  } else if (kind === 'todo') {
    const t = fd.get('t').trim(); if (!t) return;
    (S.todos[S.todoDate] = S.todos[S.todoDate] || []).push({ id: newId(), text: t, done: false });
    saveTodos(S.todoDate); render(); document.getElementById('newtodo')?.focus();
  } else if (kind === 'doc') {
    const host = findEv(form.dataset.area, form.dataset.ev); if (!host) return;
    const checklist = [...form.querySelectorAll('[data-dcl]')].map(r => ({ text: r.querySelector('.t').value.trim(), done: r.querySelector('[type=checkbox]').checked })).filter(x => x.text);
    const docId = form.dataset.doc === 'new' ? newId() : form.dataset.doc;
    const d = { id: docId, title: fd.get('title').trim() || '문서', date: fd.get('date'), body: fd.get('body'), checklist };
    host.docs = host.docs || []; upsert(host.docs, d);
    saveEv(host, false); toast('저장했습니다');
    goBack(`#ev/${host.area}/${encodeURIComponent(host.id)}`);
  } else if (kind === 'memo') {
    const title = fd.get('title').trim(), body = fd.get('body');
    if (!title && !body.trim()) { toast('내용을 입력해 주세요'); return; }
    const id = form.dataset.id === 'new' ? newId() : form.dataset.id;
    saveMemo({ id, title, body, updatedAt: Date.now() }); toast('저장했습니다'); goBack('#memo');
  } else if (kind === 'cats') {
    const rows = [...form.querySelectorAll('[data-cat] .t')];
    const list = [...new Set(rows.map(i => i.value.trim()).filter(Boolean))];
    if (!list.length) { toast('구분이 하나 이상 있어야 합니다'); return; }
    rows.forEach(i => {   // 이름을 바꾼 구분은 그 구분의 일정도 함께 바꿈
      const o = i.dataset.orig, n = i.value.trim();
      if (o && n && o !== n && !list.includes(o)) S.pev.filter(x => x.cat === o).forEach(x => { x.cat = n; saveEv(x, false); });
    });
    saveProfile({ categories: list }); render(); toast('구분을 저장했습니다');
  } else if (kind === 'item') {
    const id = form.dataset.id, old = itemOf(id) || { order: Math.max(0, ...S.items.map(i => i.order || 0)) + 1 };
    const slotType = fd.get('slotType') || null, lead = fd.get('lead');
    const it = { ...old, id, group: fd.get('group').trim(), name: fd.get('name').trim(), freq: fd.get('freq').trim(), slotType,
      times: slotType ? 2 : Math.max(0, parseInt(fd.get('times'), 10) || 0), leadDays: lead === '' ? null : +lead,
      prep: fd.get('prep').split('\n').map(s => s.trim()).filter(Boolean) };
    saveItem(it); toast('저장했습니다'); nav('#group/' + encodeURIComponent(it.group), true);
  } else if (kind === 'miglogin') {
    migLogin(fd.get('id').trim(), fd.get('pw'));
  }
});

/* ---------- 시작 ---------- */
render();
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
